# ================================================================
# Nginx Server Configuration
# Main server block for portfolio optimization dashboard
# ================================================================

# Redirect HTTP to HTTPS (when SSL is enabled)
server {
    listen 80;
    server_name _;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect to HTTPS if SSL is enabled
    # Uncomment the following lines when SSL is configured
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }
    
    # For non-SSL deployments, proxy directly
    location / {
        return 301 $scheme://$server_name:8501$request_uri;
    }
}

# Main application server
server {
    listen 80;
    server_name localhost;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Client settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # ===== DASHBOARD ROUTES =====
    location / {
        # Rate limiting
        limit_req zone=dashboard burst=10 nodelay;
        
        # Proxy settings
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Streamlit specific routes
    location ^~ /static {
        proxy_pass http://dashboard/static/;
    }
    
    location ^~ /_stcore {
        proxy_pass http://dashboard/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    
    # ===== API ROUTES =====
    location /api/ {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        
        # Proxy to data pipeline service
        proxy_pass http://data_pipeline/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for longer-running operations
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # ===== HEALTH CHECKS =====
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /health/dashboard {
        proxy_pass http://dashboard/_stcore/health;
        access_log off;
    }
    
    location /health/pipeline {
        proxy_pass http://data_pipeline/health;
        access_log off;
    }
    
    # ===== STATIC FILES =====
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # ===== ERROR PAGES =====
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

