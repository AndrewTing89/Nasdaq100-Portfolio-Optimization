version: '3.8'

# Simplified Docker Compose for Portfolio Optimization - Without PostgreSQL
# Focuses on fixing data freshness issues with live API data

services:
  # ===== DATA PIPELINE SERVICE =====
  data-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.data-pipeline
    container_name: portfolio-data-pipeline
    restart: unless-stopped
    environment:
      # Configuration from environment
      - DATA_DIR=/data
      - USE_API_PIPELINE=${USE_API_PIPELINE:-true}  # Enable live data fetching
      - FMP_API_KEY=${FMP_API_KEY:-USIa8HA0z2NCAdBwL1ZEHnpMaxe73DF8}
      - RISK_FREE_RATE=${RISK_FREE_RATE:-0.02}
      - MIN_WEIGHT_THRESHOLD=${MIN_WEIGHT_THRESHOLD:-0.01}
      - MAX_STOCKS=${MAX_STOCKS:-100}
      - RISK_AVERSION=${RISK_AVERSION:-2.5}
      - TAU=${TAU:-0.025}
      - HISTORICAL_PERIOD=${HISTORICAL_PERIOD:-5y}
      - REQUEST_DELAY=${REQUEST_DELAY:-1.0}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      # File storage
      - ENABLE_FILE_STORAGE=${ENABLE_FILE_STORAGE:-true}
      # Logging configuration
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persistent data storage
      - ./data:/data
      - ./logs:/data/logs
    networks:
      - portfolio-network
    ports:
      # HTTP API for health checks and manual triggers
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ===== DASHBOARD SERVICE =====
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: portfolio-dashboard
    restart: unless-stopped
    depends_on:
      data-pipeline:
        condition: service_healthy
    environment:
      # Streamlit configuration
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      # Data access configuration
      - DATA_DIR=/data
      - PIPELINE_API_URL=http://data-pipeline:8080
      # UI configuration
      - DASHBOARD_TITLE=${DASHBOARD_TITLE:-Portfolio Optimization Dashboard}
      - DASHBOARD_ICON=${DASHBOARD_ICON:-📈}
    volumes:
      # Read-only access to data
      - ./data:/data:ro
      - ./logs:/data/logs:ro
    networks:
      - portfolio-network
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===== SCHEDULER SERVICE =====
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: portfolio-scheduler
    restart: unless-stopped
    depends_on:
      data-pipeline:
        condition: service_healthy
    environment:
      # Cron configuration
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 6 * * *}  # Daily at 6 AM UTC
      - PIPELINE_URL=http://data-pipeline:8080
      - TZ=${TIMEZONE:-UTC}
      # Notification settings
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - NOTIFICATION_ENABLED=${NOTIFICATION_ENABLED:-false}
    volumes:
      # Access to logs for monitoring
      - ./logs:/data/logs
      - ./logs/cron:/var/log/cron
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ===== NGINX REVERSE PROXY =====
  nginx:
    image: nginx:1.25-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    depends_on:
      - dashboard
      - data-pipeline
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_PORT=${NGINX_PORT:-80}
    volumes:
      # Nginx configuration
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portfolio-network
    ports:
      # HTTP
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

# ===== NETWORKS =====
networks:
  portfolio-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: portfolio-br0